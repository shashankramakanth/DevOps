services:
  terraform:
    build: .
    image: terraform-container
    container_name: terraform-container
    volumes:
      # Mount only workspace and terraform cache (no Azure config persistence)
      - ./azure-data:/workspace
      - ./terraform-cache:/root/.terraform
      - ../../../DevOps:/DevOps
      - ./deploycost:/deploycost
    environment:
      # Azure credentials will be passed via environment variables
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: bash -c "pip install -e /deploycost && tail -f /dev/null"