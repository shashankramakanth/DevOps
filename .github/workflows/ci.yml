name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - apps/frontend/**
  pull_request:
    branches: [main]
    paths:
      - apps/frontend/**

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/frontend/Dockerfile

  build-scan-push:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase image names; github.repository may contain uppercase
      - name: Set lowercase image name
        id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/sentinel-frontend" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ steps.meta.outputs.image }}:${{ github.sha }} ${{ steps.meta.outputs.image }}:latest
          docker push ${{ steps.meta.outputs.image }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.image }}:latest
